# CI: builds an installable DEBUG Android APK from the OneNote Lite web app
# using Capacitor + Gradle, and uploads the APK as a downloadable artifact.

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  build:
    # Pinned to Ubuntu 24.04 (stable LTS) instead of the moving "ubuntu-latest"
    # label, which migrates to Ubuntu 26.04 after October 19, 2026.
    runs-on: ubuntu-24.04

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      # v5 targets Node.js 24 and clears the Node 20 deprecation warning.
      - uses: actions/checkout@v5

      # Node.js 24 — required by @capacitor/cli (npx cap sync).
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # Java 17 — required by Android Gradle Plugin 8.x.
      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK — platform-tools + android-34 (matches compileSdkVersion = 34
      # in android/variables.gradle) + matching build-tools.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      # Install Capacitor CLI/platform packages from the lockfile.
      - name: Install npm dependencies
        run: npm ci

      # Copy web assets (www/) into the committed android/ project and update
      # plugin registration. The android/ folder is already in the repo, so we
      # deliberately do NOT run `cap add android` here.
      - name: Sync web assets into the Android project
        run: npx cap sync android

      # Build the debug (unsigned) APK. Gradle wrapper (gradlew + wrapper jar)
      # is committed under android/, so no extra Gradle install is needed.
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # Upload ONLY the APK as the artifact.
      # v5 runs on Node 24 — clears the Node 20 deprecation warning.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: lite-onenote-clone-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
