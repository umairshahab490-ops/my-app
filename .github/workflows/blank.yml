# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # Pinned to Ubuntu 24.04 (stable LTS) instead of the moving "ubuntu-latest"
    # label, which migrates to Ubuntu 26.04 after October 19, 2026.
    runs-on: ubuntu-24.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      # v5 targets Node.js 24 and clears the Node 20 deprecation warning.
      - uses: actions/checkout@v5

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

      # Assemble the deployable bundle from the app sources.
      # OneNote Lite is dependency-free (no bundler/transpiler), so "building"
      # simply means copying the 4 shipped files into ./dist. Test harnesses,
      # node_modules, and preview screenshots are intentionally excluded.
      - name: Build app bundle
        run: |
          mkdir -p dist
          cp OneNote-Clone/index.html \
             OneNote-Clone/style.css \
             OneNote-Clone/markdown.js \
             OneNote-Clone/app.js \
             dist/
          ls -la dist

      # Upload the built artifact (v4 runs on Node 24 — no deprecation warning).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/
          if-no-files-found: error
